<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="PiMoa principle diagram">
  <rect width="1200" height="720" fill="#f7fbff"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#12324a">PiMoa: a review panel for AI, with evidence and a referee</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4d6475">Several models answer in blind parallel, each inside a read-only sandbox.</text>
  <text x="600" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4d6475">One model reads every answer and writes the verdict. If any of them fails, nothing ships.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f80ed"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f9d55"/>
    </marker>
  </defs>

  <rect x="40" y="245" width="175" height="130" rx="18" fill="#ffffff" stroke="#2f80ed" stroke-width="3"/>
  <text x="127" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#12324a">Your question</text>
  <text x="127" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">plus the exact</text>
  <text x="127" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">files to look at</text>

  <path d="M217 310 L274 310" stroke="#2f80ed" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="247" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2f80ed">prompt</text>

  <rect x="280" y="168" width="460" height="308" rx="22" fill="#eef6ff" stroke="#7aa7d8" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="510" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#34556e">READ-ONLY SANDBOX · no network · no writes · no keys</text>

  <rect x="304" y="212" width="412" height="78" rx="12" fill="#ffffff" stroke="#2f80ed" stroke-width="2"/>
  <text x="328" y="243" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12324a">Proposer A</text>
  <text x="328" y="271" font-family="Arial, sans-serif" font-size="14" fill="#4d6475">independent · blind to the others · cites file + line</text>

  <rect x="304" y="300" width="412" height="78" rx="12" fill="#ffffff" stroke="#2f80ed" stroke-width="2"/>
  <text x="328" y="331" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12324a">Proposer B</text>
  <text x="328" y="359" font-family="Arial, sans-serif" font-size="14" fill="#4d6475">independent · blind to the others · cites file + line</text>

  <rect x="304" y="388" width="412" height="78" rx="12" fill="#ffffff" stroke="#2f80ed" stroke-width="2"/>
  <text x="328" y="419" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#12324a">Proposer C</text>
  <text x="328" y="447" font-family="Arial, sans-serif" font-size="14" fill="#4d6475">independent · blind to the others · cites file + line</text>

  <path d="M742 310 L799 310" stroke="#2f80ed" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="771" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2f80ed">proposals</text>

  <rect x="805" y="225" width="166" height="170" rx="18" fill="#eaf4ff" stroke="#2f80ed" stroke-width="3"/>
  <text x="888" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#12324a">Aggregator</text>
  <text x="888" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#34556e">the referee</text>
  <text x="888" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4d6475">reads every proposal,</text>
  <text x="888" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4d6475">order shuffled,</text>
  <text x="888" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4d6475">follows the evidence</text>

  <path d="M973 310 L1031 310" stroke="#1f9d55" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="1002" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1f9d55">verdict</text>

  <rect x="1035" y="225" width="155" height="170" rx="18" fill="#ffffff" stroke="#1f9d55" stroke-width="3"/>
  <text x="1112" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#12324a">Verdict</text>
  <text x="1112" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#34556e">+ a receipt</text>
  <text x="1112" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4d6475">sha256 · DONE marker</text>
  <text x="1112" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4d6475">degraded runs say 2/3,</text>
  <text x="1112" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4d6475">never a fake 3/3</text>

  <rect x="45" y="520" width="354" height="135" rx="18" fill="#fff8e8" stroke="#f2a900" stroke-width="3"/>
  <text x="222" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#12324a">Fail closed</text>
  <text x="222" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">One proposer down, empty or</text>
  <text x="222" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">timed out → the whole run fails.</text>
  <text x="222" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">No plausible half-answers.</text>

  <rect x="423" y="520" width="354" height="135" rx="18" fill="#fff8e8" stroke="#f2a900" stroke-width="3"/>
  <text x="600" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#12324a">Caps, not prompts</text>
  <text x="600" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">"Answer in 200 words" is ignored;</text>
  <text x="600" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">a maxTokens cap is not. 5 tool</text>
  <text x="600" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">calls, 200k tokens — hard limits.</text>

  <rect x="801" y="520" width="354" height="135" rx="18" fill="#fff8e8" stroke="#f2a900" stroke-width="3"/>
  <text x="978" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#12324a">The model never writes files</text>
  <text x="978" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">moa_deliver writes with system code:</text>
  <text x="978" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">path jail → tmp → fsync → rename →</text>
  <text x="978" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4d6475">read back and check SHA-256.</text>
</svg>
